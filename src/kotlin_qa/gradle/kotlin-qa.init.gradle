// Loaded by kotlin-qa with `gradle -I`, so the project's own build files need no change.
//
//   kqa.detekt.version  the pinned Detekt release
//   kqa.detekt.configs  Detekt configuration files, separated by the path separator; a later
//                       file overrides an earlier one
//
// It does three things: it adds Detekt to each Kotlin module, it turns on unit test coverage for
// Android modules, and it makes every Kotlin compiler warning an error.

def detektVersion = System.getProperty("kqa.detekt.version")
def detektConfigs = (System.getProperty("kqa.detekt.configs") ?: "")
        .split(File.pathSeparator).findAll { it }

// Detekt joins the root build's own plugin class path, so it sees the same Kotlin plugin classes
// the build uses, instead of a second copy from this script's loader.
gradle.beforeProject { project ->
    if (detektVersion && project == project.rootProject) {
        project.buildscript {
            repositories {
                mavenCentral()
                gradlePluginPortal()
            }
            dependencies {
                classpath "dev.detekt:detekt-gradle-plugin:${detektVersion}"
            }
        }
    }
    project.pluginManager.withPlugin("com.android.application") {
        project.extensions.getByName("android").buildTypes.getByName("debug").enableUnitTestCoverage = true
    }
    project.pluginManager.withPlugin("com.android.library") {
        project.extensions.getByName("android").buildTypes.getByName("debug").enableUnitTestCoverage = true
    }
    project.tasks.configureEach { task ->
        if (task.class.name.startsWith("org.jetbrains.kotlin.gradle.tasks.KotlinCompile")) {
            task.compilerOptions.allWarningsAsErrors.set(true)
        }
    }
}

gradle.afterProject { project ->
    def kotlinModule = ["com.android.application", "com.android.library", "org.jetbrains.kotlin.jvm"]
            .any { project.plugins.hasPlugin(it) }
    if (detektVersion && kotlinModule) {
        project.pluginManager.apply("dev.detekt")
        project.extensions.getByName("detekt").with {
            buildUponDefaultConfig.set(true)
            config.setFrom(detektConfigs.collect { path -> project.file(path) })
        }
    }
}
