# kotlin-qa's default Detekt configuration. It is applied on top of Detekt's own defaults
# (buildUponDefaultConfig), and a project's qa/detekt.yml is applied on top of this file.
#
# This file turns ON the rules Detekt ships switched off that catch defects rather than taste, and
# fixes the settings that would otherwise disagree with ktlint's official style, which kotlin-qa
# also runs. It never switches a default rule off. A project that changes anything here writes why
# directly above the change (kqaci.detekt.unjustified).

coroutines:
  CoroutineLaunchedInTestWithoutRunTest:
    active: true
  GlobalCoroutineUsage:
    active: true
  SuspendFunInFinallySection:
    active: true
  SuspendFunSwallowedCancellation:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true

exceptions:
  ErrorUsageWithThrowable:
    active: true
  NotImplementedDeclaration:
    active: true
  ObjectExtendsThrowable:
    active: true
  ThrowingExceptionInMain:
    active: true

performance:
  CouldBeSequence:
    active: true
  UnnecessaryPartOfBinaryExpression:
    active: true
  UnnecessaryTypeCasting:
    active: true

potential-bugs:
  CastNullableToNonNullableType:
    active: true
  CastToNullableType:
    active: true
  CharArrayToStringCall:
    active: true
  Deprecation:
    active: true
  DontDowncastCollectionTypes:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  ExitOutsideMain:
    active: true
  ImplicitUnitReturnType:
    active: true
  MissingPackageDeclaration:
    active: true
  MissingSuperCall:
    active: true
  MissingUseCall:
    active: true
  NullCheckOnMutableProperty:
    active: true
  NullableToStringCall:
    active: true
  PropertyUsedBeforeDeclaration:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullCheck:
    active: true

complexity:
  CognitiveComplexMethod:
    active: true
  NestedScopeFunctions:
    active: true
  ReplaceSafeCallChainWithRun:
    active: true

style:
  CanBeNonNullable:
    active: true
  CollapsibleIfStatements:
    active: true
  DoubleNegativeExpression:
    active: true
  DoubleNegativeLambda:
    active: true
  ExplicitCollectionElementAccessMethod:
    active: true
  NullableBooleanCheck:
    active: true
  RangeUntilInsteadOfRangeTo:
    active: true
  UnnecessaryAny:
    active: true
  UnnecessaryLet:
    active: true
  UnnecessaryReversed:
    active: true
  UseEmptyCounterpart:
    active: true
  UseIfEmptyOrIfBlank:
    active: true
  UseSumOfInsteadOfFlatMapSize:
    active: true
  # ktlint_official, which formats the code, allows 140 columns: one limit, not two.
  MaxLineLength:
    maxLineLength: 140
  # A number is clear in a named constant, a named argument, a property initialiser or a test;
  # it is magic in the middle of arithmetic.
  MagicNumber:
    ignoreNumbers: ['-1', '0', '1', '2']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignoreNamedArgument: true
    ignoreExtensionFunctions: true
